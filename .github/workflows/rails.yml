name: rails-guard
# Charter §7 item 1 — server-side rail enforcement: frozen-file integrity on every push/PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen-file integrity check
        run: bash scripts/rails-guard.sh check
